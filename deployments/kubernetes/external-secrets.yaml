# Syncs platform secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud> (Azure Key Vault in the primary deployment).
# Requires the External Secrets Operator and a ClusterSecretStore named
# "platform-secrets" bound to that secret manager. Remote keys match the
# names Terraform creates; audit keys are created out of band (runbook).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: runtime-authorization-database
  namespace: runtime-authorization
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: runtime-authorization-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: runtime-authorization-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: runtime-authorization-audit-key
  namespace: runtime-authorization
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: runtime-authorization-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^runtime-authorization-audit-key-"
      rewrite:
        - regexp:
            source: "^runtime-authorization-audit-key-(.*)$"
            target: "audit-$1.pem"
